services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: adaplus
      POSTGRES_USER: adaplus
      POSTGRES_PASSWORD: adaplus_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ada-plus-backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/adaplus
    depends_on:
      - db

volumes:
  postgres_data: