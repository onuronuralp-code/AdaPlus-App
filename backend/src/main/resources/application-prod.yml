spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

cors:
  allowed-origins:
    - ${FRONTEND_URL}

# ── Actuator — heapdump/threaddump can leak secrets and PII held in memory;
# restrict prod to health/info/metrics/caches regardless of the base profile's exposure list ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    heapdump:
      enabled: false
    threaddump:
      enabled: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
