spring:
  application:
    name: ada-plus-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000       # 10 min — release idle connections
      connection-timeout: 20000  # 20 sec — fail fast if pool exhausted
      max-lifetime: 1800000      # 30 min — rotate connections before DB cuts them
  jpa:
    open-in-view: false
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # ── File uploads ──
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  # ── Caching with Caffeine ──
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=200,expireAfterWrite=120s

# ── Swagger / OpenAPI ──
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ── Rate limiting ──
rate-limit:
  requests-per-minute: 300
  burst-capacity: 100

# ── CORS ──
cors:
  allowed-origins:
    - "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}"
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  max-age-seconds: 3600

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches,heapdump,threaddump
  endpoint:
    health:
      show-details: when-authorized
    heapdump:
      enabled: true
    threaddump:
      enabled: true
  health:
    mail:
      enabled: false

# ── JWT ──
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 7776000000  # 90 days
  mail:
    from: noreply@adaplus.app
    contact-recipient: ${CONTACT_EMAIL:adaplusapp@gmail.com}
  frontend-url: ${FRONTEND_URL:http://localhost:8081}
  email:
    enabled: ${EMAIL_ENABLED:true}
  admin:
    seed:
      enabled: ${ADMIN_SEED_ENABLED:false}
      email: ${ADMIN_SEED_EMAIL:}
      password: ${ADMIN_SEED_PASSWORD:}
    ui-secret: ${ADMIN_UI_SECRET:}
    review-secret: ${ADMIN_REVIEW_SECRET:}
    notification-emails: ${ADMIN_NOTIFICATION_EMAILS:}
  bedrock:
    region: ${AWS_BEDROCK_REGION:us-east-1}
    model-id: ${BEDROCK_MODEL_ID:us.anthropic.claude-haiku-4-5-20251001-v1:0}
    moderation-model-id: ${BEDROCK_MODERATION_MODEL_ID:us.anthropic.claude-haiku-4-5-20251001-v1:0}
    moderation-enabled: ${BEDROCK_MODERATION_ENABLED:true}
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  s3:
    enabled: ${S3_ENABLED:false}
    bucket: ${S3_BUCKET:adaplus-media}
    region: ${S3_REGION:eu-central-1}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  media:
    local-upload-dir: ${MEDIA_UPLOAD_DIR:./uploads}
  forum:
    enabled: ${FORUM_ENABLED:true}
    daily-post-limit: 5
    daily-reply-limit: 10
  listing:
    monthly-limit: 5
  guide:
    daily-limit: 5
    knowledge-base-path: ${KNOWLEDGE_BASE_PATH:./knowledge-base}
  version:
    minimum: ${APP_MINIMUM_VERSION:1.0.0}
    latest: ${APP_LATEST_VERSION:1.0.0}
  sms:
    enabled: ${SMS_ENABLED:false}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    from-number: ${WHATSAPP_FROM_NUMBER:}

# ── Sentry error monitoring ──
sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.2
  environment: ${SPRING_PROFILES_ACTIVE:default}
  ignored-exceptions-for-type:
    - app.adaplus.backend.exception.DailyLimitExceededException
    - app.adaplus.backend.exception.ConflictException
    - app.adaplus.backend.exception.InvalidTokenException
    - app.adaplus.backend.exception.UnauthorizedException
