timezone: Europe/Istanbul
origin: "Kınalıada"

# NOTE:
# - "Pazar ve (Resmi) Tatil Günleri" tarifesi = Sunday + Public Holidays
# - Backend currently distinguishes only by day-of-week; public-holiday logic can be added later.

routes:
  # -----------------------------
  # ŞEHİR HATLARI — Kınalıada -> Kabataş
  # Special early trip that ALSO stops at Eminönü (separate route so via is accurate)
  # -----------------------------
  - to: "Kabataş"
    provider: "Şehir Hatları"
    via: ["Kadıköy", "Eminönü"]
    calendar:
      - days: [MON,TUE,WED,THU,FRI,SAT]
        times: ["06:30"]
      - days: [SUN]
        times: ["07:00"]

  # Regular Kabataş trips (via Kadıköy, no Eminönü stop)
  - to: "Kabataş"
    provider: "Şehir Hatları"
    via: ["Kadıköy"]
    calendar:
      - days: [MON,TUE,WED,THU,FRI,SAT]
        times:
          ["07:20","08:25","09:45","11:20","12:50","14:15","15:45","17:15","18:20","19:15","20:20","21:20","22:30"]
      - days: [SUN]
        times:
          ["07:45","08:20","09:45","11:45","12:50","14:15","15:45","17:15","18:20","19:15","20:20","21:20","22:30"]

  # -----------------------------
  # ŞEHİR HATLARI — Kınalıada -> Beşiktaş (Kadıköy via)
  # -----------------------------
  - to: "Beşiktaş"
    provider: "Şehir Hatları"
    via: ["Kadıköy"]
    calendar:
      - days: [MON,TUE,WED,THU,FRI,SAT]
        times: ["07:55","11:55","16:25","18:45"]
      - days: [SUN]
        times: ["09:20","10:55","16:25","18:45"]

  # -----------------------------
  # ŞEHİR HATLARI — Kınalıada -> Bostancı
  # (From the table, Kınalıada is the last stop before Bostancı → direct)
  # -----------------------------
  - to: "Bostancı"
    provider: "Şehir Hatları"
    via: []
    calendar:
      - days: [MON,TUE,WED,THU,FRI,SAT]
        times: ["10:45","19:55","01:20"]
      - days: [SUN]
        times: ["11:25","19:55","01:20"]

  - to: "Bostancı"
    provider: "Şehir Hatları"
    via: [ "Burgazada" ]
    calendar:
      - days: [ MON,TUE,WED,THU,FRI,SAT ]
        times: [ "08:45" ]
      - days: [ SUN ]
        times: [ "08:45" ]

  - to: "Bostancı"
    provider: "Şehir Hatları"
    via: [ "Burgazada","Heybeliada","Büyükada" ]
    calendar:
      - days: [ MON,TUE,WED,THU,FRI,SAT ]
        times: [ "02:25","05:10","15:35","22:10" ]
      - days: [ SUN ]
        times: [ "02:25","05:10","15:35","22:10" ]

  # -----------------------------
  # MAVİ MARMARA — Kınalıada -> Bostancı (Direct)
  # - 06:30 DOES NOT run on Sunday & Public Holidays (excluded from SUN)
  # - 20:35 was temporary until 01 Nov 2025 → excluded to avoid wrong info now
  # -----------------------------
  - to: "Bostancı"
    provider: "Mavi Marmara"
    via: []
    calendar:
      - days: [MON,TUE,WED,THU,FRI,SAT]
        times: ["06:30","07:15","08:00","09:00","10:00","11:30","13:00","14:10","15:25","16:40","17:40","18:30","19:20","22:00"]
      - days: [SUN]
        times: ["07:15","08:00","09:00","10:00","11:30","13:00","14:10","15:25","16:40","17:40","18:30","19:20","22:00"]

  # -----------------------------
  # ŞEHİR HATLARI — Kınalıada -> Maltepe
  # - 07:05 and 08:00 marked (*) do NOT run on Sunday & Public Holidays
  # -----------------------------
  - to: "Maltepe"
    provider: "Şehir Hatları"
    via: ["Burgazada","Heybeliada","Büyükada"]
    calendar:
      - days: [MON,TUE,WED,THU,FRI,SAT]
        times: ["07:05","08:00","10:30","14:00","17:10"]
      - days: [SUN]
        times: ["10:30","14:00","17:10"]
